<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta-Tags -->
  <title>APRS Live-Ticker – Realtime Datenfluss</title>
  <meta name="description" content="Echtzeit-Laufband des APRS-Datenflusses für Amateurfunk und mobile Stationen.">
  <meta name="robots" content="index, follow">
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .ticker-wrapper {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background-color: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .ticker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
    }

    .ticker-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .led-lamp {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #dc2626;
      box-shadow: 0 0 6px #dc2626;
      transition: all 0.3s ease;
    }

    .led-lamp.online {
      background-color: #16a34a;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Laufband-Container */
    .ticker-container {
      position: relative;
      width: 100%;
      height: 60px;
      background: #1e293b;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      animation: scrollTicker 35s linear infinite;
    }

    /* Bei Mouseover anhalten, damit man Details lesen kann */
    .ticker-container:hover .ticker-track {
      animation-play-state: paused;
    }

    @keyframes scrollTicker {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0 25px;
      font-size: 15px;
      border-right: 1px solid #334155;
    }

    .ticker-time {
      color: #94a3b8;
      font-size: 13px;
      font-family: monospace;
    }

    .ticker-call {
      color: #f8fafc;
      font-weight: bold;
    }

    .ticker-coords {
      color: #38bdf8;
      font-size: 13px;
      font-family: monospace;
    }

    .ticker-comment {
      color: #cbd5e1;
      font-style: italic;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<div class="ticker-wrapper">
  <div class="ticker-header">
    <div class="ticker-title">
      <span>⚡ APRS Live-Datenstrom Ticker</span>
    </div>
    <div class="status-badge">
      <div id="led-indicator" class="led-lamp"></div>
      <span id="status-text">OFFLINE</span>
    </div>
  </div>

  <div class="ticker-container">
    <div id="ticker-track" class="ticker-track">
      <div class="ticker-item">Lade APRS Datenstrom...</div>
    </div>
  </div>
</div>

<script>
  const BASE_URL = "https://aprs-server.onrender.com";

  async function fetchTickerData() {
    const ledIndicator = document.getElementById('led-indicator');
    const statusText = document.getElementById('status-text');
    const track = document.getElementById('ticker-track');

    try {
      // Wir holen die frischen Daten der letzten 1 Stunde
      const response = await fetch(`${BASE_URL}/history.json?hours=1`);
      if (!response.ok) throw new Error("HTTP Fehler " + response.status);

      const data = await response.json();
      
      ledIndicator.classList.add('online');
      statusText.innerText = "ONLINE";

      if (Array.isArray(data) && data.length > 0) {
        // Neueste Baken zuerst anzeigen (optional umkehren oder so lassen)
        const recentItems = data.slice(-50).reverse();

        let htmlContent = "";
        
        // Wir doppeln den Inhalt einmal, damit das CSS-Laufband nahtlos (infinite) durchläuft
        for (let i = 0; i < 2; i++) {
          recentItems.forEach(item => {
            const timeStr = item.time ? new Date(item.time).toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : '';
            const commentText = item.comment ? item.comment.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';

            htmlContent += `
              <div class="ticker-item">
                <span class="ticker-time">[${timeStr}]</span>
                <span class="ticker-call">${item.callsign}</span>
                <span class="ticker-coords">(${item.lat.toFixed(4)}, ${item.lon.toFixed(4)})</span>
                <span class="ticker-comment">${commentText}</span>
              </div>
            `;
          });
        }

        track.innerHTML = htmlContent;
      } else {
        track.innerHTML = `<div class="ticker-item">Keine aktuellen Baken in der letzten Stunde empfangen.</div>`;
      }

    } catch (error) {
      console.error("Fehler beim Ticker-Abruf:", error);
      ledIndicator.classList.remove('online');
      statusText.innerText = "OFFLINE";
    }
  }

  // Initial laden
  fetchTickerData();

  // Alle 30 Sekunden im Hintergrund aktualisieren
  setInterval(fetchTickerData, 30000);
</script>

</body>
</html>
